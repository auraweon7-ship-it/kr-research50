<script>
// 서버가 캐시 지시를 보내지 않아 브라우저가 옛 index.html을 붙들 수 있다.
// 서버의 config.js 버전이 이 파일의 버전과 다르면 주소에 버전을 붙여 새 index.html을 받는다.
(function () {
  var BUILD = '1.12.1';
  fetch('assets/config.js?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/VERSION: '([^']+)'/);
    if (!m || m[1] === BUILD || sessionStorage.getItem('nrf50.reloaded') === m[1]) return;
    sessionStorage.setItem('nrf50.reloaded', m[1]);
    var u = new URL(location.href); u.searchParams.set('r', m[1]); location.replace(u.toString());
  }).catch(function () {});
})();
</script>
